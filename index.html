<style>
  :root{
    --bg:#F7F3E6; --bg-alt:#EFE7D0; --surface:#FFFFFF; --surface-2:#FAF6E9;
    --border:#E3D8B4; --border-strong:#C9B878;
    --text:#211C10; --text-muted:#6E6448; --text-faint:#9C9270;
    --accent:#8A6A16; --accent-strong:#644B0D; --accent-soft:#F1E5C1; --accent-ink:#FFFCF3;
    --good:#2F6A38; --good-bg:#E3EFE1; --good-border:#B9D6B7;
    --warn:#93601A; --warn-bg:#F5E9D2; --warn-border:#E1C486;
    --danger:#963527; --danger-bg:#F5DED8; --danger-border:#E2B4A6;
    --shadow:0 1px 2px rgba(40,30,10,.08), 0 6px 18px rgba(40,30,10,.08);
    --radius:10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0B09; --bg-alt:#131209; --surface:#17160F; --surface-2:#1E1C12;
      --border:#332D1A; --border-strong:#4A4022;
      --text:#F2E9D0; --text-muted:#B7AC86; --text-faint:#7C7355;
      --accent:#D4AF37; --accent-strong:#E9CB6B; --accent-soft:#2B2410; --accent-ink:#14120A;
      --good:#84CC90; --good-bg:#1D3220; --good-border:#335E3A;
      --warn:#E7B563; --warn-bg:#372A12; --warn-border:#5C481F;
      --danger:#E4917D; --danger-bg:#3A1D17; --danger-border:#61362A;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 24px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0B09; --bg-alt:#131209; --surface:#17160F; --surface-2:#1E1C12;
    --border:#332D1A; --border-strong:#4A4022;
    --text:#F2E9D0; --text-muted:#B7AC86; --text-faint:#7C7355;
    --accent:#D4AF37; --accent-strong:#E9CB6B; --accent-soft:#2B2410; --accent-ink:#14120A;
    --good:#84CC90; --good-bg:#1D3220; --good-border:#335E3A;
    --warn:#E7B563; --warn-bg:#372A12; --warn-border:#5C481F;
    --danger:#E4917D; --danger-bg:#3A1D17; --danger-border:#61362A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Source Sans 3', system-ui, -apple-system, sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1180px; margin:0 auto; padding:20px 20px 64px;}
  h1,h2,h3{font-family:'Big Shoulders Display', system-ui, sans-serif; font-weight:800; text-wrap:balance; margin:0;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  button{font-family:inherit; cursor:pointer;}
  input, select, textarea{font-family:inherit; font-size:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:8px 10px;}
  input:focus, select:focus, textarea:focus, button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  ::placeholder{color:var(--text-faint);}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}

  /* ---- header / manifest strip ---- */
  .brandbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0 14px; border-bottom:2px solid var(--border-strong); flex-wrap:wrap;}
  .brandmark{display:flex; align-items:center; gap:12px;}
  .logo-badge{display:inline-flex; align-items:center; justify-content:center; background:#0B0B09; border-radius:9px; box-shadow:0 0 0 1px rgba(201,163,74,.4), var(--shadow); flex:none; overflow:hidden;}
  .brandmark .logo-badge{width:44px; height:44px; padding:6px;}
  .logo-badge img{width:100%; height:100%; object-fit:contain; display:block;}
  .brandmark .brandtext{display:flex; flex-direction:column; gap:1px;}
  .brandmark h1{font-size:1.5rem; letter-spacing:.01em; text-transform:uppercase; line-height:1.1;}
  .brandmark .sub{font-size:.78rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em;}
  .headerbtns{display:flex; gap:8px;}
  .btn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text); border-radius:7px; padding:8px 14px; font-weight:600; font-size:.88rem; transition:background .12s,border-color .12s;}
  .btn:hover{background:var(--surface-2);}
  .btn-accent{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-accent:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn-quiet{border-color:transparent; background:transparent;}
  .btn-quiet:hover{background:var(--surface-2);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-sm{padding:5px 10px; font-size:.78rem; border-radius:6px;}

  .statstrip{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin:16px 0 22px; box-shadow:var(--shadow);}
  .stat{background:var(--surface); padding:12px 16px;}
  .stat .n{font-family:'IBM Plex Mono'; font-weight:600; font-size:1.5rem; font-variant-numeric:tabular-nums;}
  .stat .n.alert{color:var(--danger);}
  .stat .lbl{font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-top:2px;}

  /* ---- tabs ---- */
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; flex-wrap:wrap;}
  .tab{padding:10px 16px; border:none; background:none; font-weight:700; font-family:'Big Shoulders Display'; letter-spacing:.02em; text-transform:uppercase; font-size:.95rem; color:var(--text-muted); border-bottom:3px solid transparent; margin-bottom:-1px; border-radius:0;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--accent-strong); border-bottom-color:var(--accent);}
  .tab .badge{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:99px; font-family:'IBM Plex Mono'; font-size:.72rem; background:var(--danger-bg); color:var(--danger); vertical-align:1px;}
  .tab .badge.warn{background:var(--warn-bg); color:var(--warn);}

  .panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .panel-head h2{font-size:1.4rem; text-transform:uppercase; letter-spacing:.01em;}
  .panel-head .hint{color:var(--text-muted); font-size:.85rem;}

  /* ---- banner / toast ---- */
  .banner{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:.88rem; border:1px solid; }
  .banner.info{background:var(--accent-soft); border-color:var(--border-strong); color:var(--text);}
  .banner.warn{background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn);}
  .banner.good{background:var(--good-bg); border-color:var(--good-border); color:var(--good);}

  /* ---- search / filters ---- */
  .toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .toolbar input[type=search], .toolbar input[type=text]{min-width:230px; flex:1;}
  .toolbar select{min-width:150px;}

  /* ---- table ---- */
  .tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow);}
  table{border-collapse:collapse; width:100%; min-width:640px;}
  thead th{position:sticky; top:0; background:var(--surface-2); text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.low td{background:var(--warn-bg);}
  tbody tr.out td{background:var(--danger-bg);}
  .num{text-align:right; font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums;}
  .muted{color:var(--text-muted);}
  .faint{color:var(--text-faint); font-size:.82rem;}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px; font-size:.76rem; font-weight:600; border:1px solid;}
  .pill-good{background:var(--good-bg); color:var(--good); border-color:var(--good-border);}
  .pill-warn{background:var(--warn-bg); color:var(--warn); border-color:var(--warn-border);}
  .pill-danger{background:var(--danger-bg); color:var(--danger); border-color:var(--danger-border);}
  .pill-quiet{background:var(--surface-2); color:var(--text-muted); border-color:var(--border);}

  /* ---- order builder ---- */
  .order-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start;}
  @media (max-width:820px){ .order-grid{grid-template-columns:1fr;} }
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
  .field label{font-size:.76rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600;}
  .field input, .field select{width:100%;}
  .suggest{border:1px solid var(--border); border-radius:8px; margin-top:6px; overflow:hidden; background:var(--surface);}
  .suggest button{display:block; width:100%; text-align:left; padding:8px 10px; border:none; background:none; border-bottom:1px solid var(--border); font-size:.86rem; color:var(--text);}
  .suggest button:last-child{border-bottom:none;}
  .suggest button:hover{background:var(--surface-2);}
  .suggest .sname{font-weight:600;}
  .suggest .smeta{color:var(--text-muted); font-size:.78rem;}

  .ticket{background:var(--surface); border:1px dashed var(--border-strong); border-radius:var(--radius); padding:18px; position:sticky; top:16px;}
  .ticket h3{font-size:1.05rem; text-transform:uppercase; letter-spacing:.02em; margin-bottom:2px;}
  .ticket .ticket-sub{color:var(--text-muted); font-size:.82rem; margin-bottom:12px;}
  .lineitem{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid var(--border);}
  .lineitem:last-of-type{border-bottom:none;}
  .lineitem .li-name{font-weight:600; font-size:.9rem;}
  .lineitem .li-meta{font-size:.78rem; color:var(--text-muted); font-family:'IBM Plex Mono';}
  .lineitem .li-right{display:flex; align-items:center; gap:8px; flex:none;}
  .qtybox{width:56px; text-align:center; padding:5px 4px;}
  .iconbtn{border:1px solid var(--border); background:var(--surface); border-radius:6px; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:.85rem; line-height:1;}
  .iconbtn:hover{background:var(--danger-bg); color:var(--danger); border-color:var(--danger-border);}
  .ticket-empty{color:var(--text-faint); font-size:.86rem; padding:16px 0; text-align:center;}
  .ticket-actions{display:flex; gap:8px; margin-top:14px;}
  .ticket-actions .btn{flex:1;}

  .emailbox{margin-top:14px; padding-top:14px; border-top:1px solid var(--border);}
  .emailbox textarea{width:100%; min-height:170px; resize:vertical; font-family:'IBM Plex Mono'; font-size:.8rem; line-height:1.55;}

  /* ---- history ---- */
  .histcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;}
  .histcard summary{list-style:none; cursor:pointer; padding:13px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .histcard summary::-webkit-details-marker{display:none;}
  .histcard .hleft{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .histcard .hbuyer{font-weight:700; font-family:'Big Shoulders Display'; text-transform:uppercase; letter-spacing:.02em; font-size:1.05rem;}
  .histcard .htime{color:var(--text-muted); font-size:.8rem; font-family:'IBM Plex Mono';}
  .histcard .hbody{padding:0 16px 16px; border-top:1px solid var(--border);}
  .histcard .hbody table{margin-top:12px;}

  /* ---- settings ---- */
  .settingswrap{position:fixed; inset:0; background:rgba(14,11,4,.5); display:flex; align-items:flex-start; justify-content:center; padding:60px 16px; z-index:40;}
  .settingsbox{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:440px; padding:22px;}
  .settingsbox h2{font-size:1.2rem; text-transform:uppercase; margin-bottom:14px;}
  .settings-close{display:flex; justify-content:flex-end;}

  /* ---- login ---- */
  .loginwrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .loginbox{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:0 28px 30px; overflow:hidden;}
  .logo-hero{display:block; width:calc(100% + 56px); margin:0 -28px 20px; box-shadow:0 1px 0 rgba(201,163,74,.4);}
  .logo-hero img{width:100%; display:block;}

  .loginbox .btn-accent{width:100%; padding:10px 14px;}
  .loginerr{background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger-border); border-radius:7px; padding:8px 11px; font-size:.84rem; margin-bottom:14px;}
  .loginuserfixed{padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:var(--surface-2); color:var(--text-muted);}

  .footnote{margin-top:30px; color:var(--text-faint); font-size:.78rem; text-align:center;}
  .savingdot{display:inline-block; width:7px; height:7px; border-radius:99px; background:var(--accent); margin-right:6px; animation:pulse 1s infinite ease-in-out;}

  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}

  @media (max-width:560px){
    .statstrip{grid-template-columns:repeat(2,1fr);}
    #app{padding:14px 12px 48px;}
  }

  }catch(e){ /* private browsing or storage blocked — session-only login still works */ }
}

var UI = {
  tab:'inventory',
  invQuery:'',
  invSort:'stock-asc',
  itemQuery:'',
  draft:{ buyerIdx:0, orderNo:'', orderDate: todayInputValue(), lines:[] },
  settingsOpen:false,
  banner:null,
  lastOrder:null,
  adjust:null,     /* {sku, value, note} */
  invoiceDraft:null,  /* {buyer, invoiceNo} */
  saving:false,
  histFilter:'all',
  authed: readStoredAuth(),
  loginPass:'',
  loginError:'',
  dbReady:false,
  dbLive:false,
  dbError:''
};

var db = null;

function initFirebase(){
  if(!FIREBASE_CONFIGURED){
    UI.dbReady = true; UI.dbLive = false;
    rerender();
    return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    var settled = false;
    var listening = false;
    function startListening(){
      if(listening) return;
      listening = true;
      var docRef = db.collection('manifest').doc('state');
      docRef.onSnapshot(function(snap){
        settled = true;
        if(snap.exists){
          var data = snap.data();
          data.orders = data.orders || [];
          data.invoices = data.invoices || [];
          data.buyers = data.buyers || DEFAULT_STATE.buyers;
          STATE = data;
        } else {
          docRef.set(DEFAULT_STATE).catch(function(){});
          STATE = DEFAULT_STATE;
        }
        UI.dbReady = true; UI.dbLive = true;
        rerender();
      }, function(err){
        settled = true;
        db = null;
        UI.dbReady = true; UI.dbLive = false;
        UI.dbError = 'database error: '+err.message;
        rerender();
      });
    }
    /* Wait for the anonymous sign-in to actually land before opening the
       Firestore listener — starting the listener before auth is attached
       can get a permanent permission-denied even though sign-in succeeds
       moments later, since a denied listener does not auto-retry. */
    firebase.auth().onAuthStateChanged(function(user){
      if(user) startListening();
    });
    firebase.auth().signInAnonymously().catch(function(err){
      db = null;
      UI.dbReady = true; UI.dbLive = false;
      UI.dbError = 'sign-in failed: '+err.message;
      rerender();
    });
    setTimeout(function(){
      if(!settled){ db = null; UI.dbReady = true; UI.dbLive = false; UI.dbError = 'timed out connecting'; rerender(); }
    }, 8000);
  }catch(e){
    db = null;
    UI.dbReady = true; UI.dbLive = false;
    UI.dbError = e.message;
    rerender();
  }
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtEUR(n){
  if(n==null || isNaN(n)) return '—';
  return '€' + Number(n).toLocaleString('en-IE', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtInt(n){ return Number(n||0).toLocaleString('en-IE'); }
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function fmtWhen(iso){
  if(!iso) return '';
  var d = new Date(iso);
  return d.toLocaleString('en-GB', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
function threshold(){ return Number(STATE.meta.threshold)||0; }
function invBySku(sku){
  for(var i=0;i<STATE.inventory.length;i++){ if(STATE.inventory[i].sku===sku) return STATE.inventory[i]; }
  return null;
}
function stockClass(stock){
  if(stock<=0) return 'out';
  if(stock<=threshold()) return 'low';
  return '';
}
function stockPill(stock){
  if(stock<=0) return '<span class="pill pill-danger">Out of stock</span>';
  if(stock<=threshold()) return '<span class="pill pill-warn">Low · '+fmtInt(stock)+' left</span>';
  return '<span class="pill pill-good">'+fmtInt(stock)+' in stock</span>';
}

function lowStockItems(){
  return STATE.inventory.filter(function(it){ return it.stock<=threshold(); })
    .sort(function(a,b){ return a.stock-b.stock; });
}
function stats(){
  var totalSku = STATE.inventory.length;
  var totalUnits = STATE.inventory.reduce(function(s,it){return s+it.stock;},0);
  var low = lowStockItems().length;
  var today = new Date().toDateString();
  var ordersToday = STATE.orders.filter(function(o){ return o.type==='order' && new Date(o.ts).toDateString()===today; }).length;
  return {totalSku:totalSku, totalUnits:totalUnits, low:low, ordersToday:ordersToday};
}

/* ---------- persistence (Firestore) ---------- */
function persist(bannerOnFail){
  STATE.meta.updated = nowISO();
  if(!db){
    UI.banner = {kind:'warn', text: bannerOnFail || 'Not connected to the live database — this change is only on this screen and won’t be saved.'};
    rerender();
    return Promise.resolve();
  }
  UI.saving = true; rerender();
  return db.collection('manifest').doc('state').set(STATE).then(function(){
    UI.saving = false;
    /* the onSnapshot listener above will re-render with the confirmed copy */
  }).catch(function(err){
    UI.saving = false;
    UI.banner = {kind:'warn', text: bannerOnFail || ('Couldn’t save that change: ' + err.message)};
    rerender();
  });
}

/* ---------- CSV export ---------- */
function toCSV(rows){
  return rows.map(function(r){
    return r.map(function(v){
      var s = v==null? '' : String(v);
      if(/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
      return s;
    }).join(',');
  }).join('\r\n');
}
function exportInventory(){
  var rows = [['Supplier Item Number','Article Number','EAN','Name','Fibre Composition','Size','Stock','Price EUR']];
  STATE.inventory.forEach(function(it){
    rows.push([it.supplier, it.sku, it.ean, it.name, it.fibre, it.size, it.stock, it.price]);
  });
  doDownload('rugscreation-stock-' + new Date().toISOString().slice(0,10) + '.csv', toCSV(rows));
}
function exportHistory(){
  var rows = [['Date','Type','Buyer','Order No.','Order Date','SKU','Name','Size','Qty Requested','Qty Fulfilled','Status','Invoiced','Invoice No.','Note']];
  STATE.orders.forEach(function(o){
    if(o.type==='adjustment'){
      rows.push([fmtWhen(o.ts),'Adjustment','', '', '', o.sku, o.name, '', '', o.after, 'adjustment', '', '', (o.before+' → '+o.after+(o.note?' — '+o.note:''))]);
    } else {
      o.lines.forEach(function(l){
        rows.push([fmtWhen(o.ts),'Order', o.buyer, o.orderNo||'', o.orderDate||'', l.sku, l.name, l.size, l.qtyRequested, l.qtyFulfilled, l.status, o.invoiced?'Yes':'No', o.invoiceNo||'', '']);
      });
    }
  });
  doDownload('rugscreation-order-history-' + new Date().toISOString().slice(0,10) + '.csv', toCSV(rows));
}
function exportInvoices(){
  var rows = [['Channel','Date','Invoice No.','Orders','Amount EUR']];
  STATE.invoices.forEach(function(iv){
    rows.push([iv.buyer, fmtWhen(iv.ts), iv.invoiceNo||'', iv.orderCount, iv.amount]);
  });
  doDownload('rugscreation-invoices-' + new Date().toISOString().slice(0,10) + '.csv', toCSV(rows));
}
function doDownload(filename, data){
  try{
    var blob = new Blob([data], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    UI.banner = {kind:'good', text:'Downloaded ' + filename + '.'};
  }catch(e){
    UI.banner = {kind:'warn', text:'Couldn’t generate the download.'};
  }
  rerender();
}

/* ---------- order logic ---------- */
function draftBuyerName(){ return STATE.buyers[UI.draft.buyerIdx] || STATE.buyers[0]; }

function addDraftLine(sku){
  var it = invBySku(sku);
  if(!it) return;
  var existing = UI.draft.lines.filter(function(l){return l.sku===sku;})[0];
  if(existing){ existing.qty += 1; }
  else { UI.draft.lines.push({sku:sku, qty:1}); }
  UI.itemQuery='';
}
function removeDraftLine(sku){
  UI.draft.lines = UI.draft.lines.filter(function(l){ return l.sku!==sku; });
}
function setDraftQty(sku, qty){
  qty = Math.max(1, Math.floor(Number(qty)||1));
  UI.draft.lines.forEach(function(l){ if(l.sku===sku) l.qty=qty; });
}

function computeAmount(lines){
  return lines.reduce(function(s,l){ return s + (l.status==='fulfilled' ? l.qtyFulfilled*(l.unitPrice||0) : 0); }, 0);
}

function processOrder(){
  if(UI.draft.lines.length===0){
    UI.banner={kind:'warn', text:'Add at least one item to the order first.'};
    rerender();
    return;
  }
  var lines = [];
  var anyFulfilled=false, anyShort=false;
  UI.draft.lines.forEach(function(dl){
    var it = invBySku(dl.sku);
    if(!it) return;
    var avail = it.stock;
    var status, qtyFulfilled;
    if(avail<=0){ status='unavailable'; qtyFulfilled=0; anyShort=true; }
    else if(dl.qty<=avail){ status='fulfilled'; qtyFulfilled=dl.qty; it.stock -= dl.qty; anyFulfilled=true; }
    else { status='short'; qtyFulfilled=0; anyShort=true; }
    lines.push({sku:it.sku, name:it.name, size:it.size, unitPrice:it.price, qtyRequested:dl.qty, qtyFulfilled:qtyFulfilled, availableAtOrder:avail, status:status});
  });
  var overall = anyFulfilled && anyShort ? 'partial' : (anyFulfilled ? 'fulfilled' : 'rejected');
  var orderNo = (UI.draft.orderNo||'').trim();
  var orderDate = UI.draft.orderDate || todayInputValue();
  var order = {id:uid('o'), type:'order', ts:nowISO(), orderNo:orderNo, orderDate:orderDate, buyer:draftBuyerName(), lines:lines, status:overall, amount:computeAmount(lines), invoiced:false, invoiceNo:null, invoicedAt:null, email:buildEmail(draftBuyerName(), lines, overall, orderNo)};
  STATE.orders.unshift(order);
  UI.lastOrder = order;
  UI.draft = {buyerIdx:UI.draft.buyerIdx, orderNo:'', orderDate:todayInputValue(), lines:[]};
  persist().then(function(){ rerender(); });
  rerender();
}

function buildEmail(buyer, lines, overall, orderNo){
  var ok = lines.filter(function(l){return l.status==='fulfilled';});
  var bad = lines.filter(function(l){return l.status!=='fulfilled';});
  var subject = 'Order confirmation' + (orderNo? ' – ref '+orderNo : '') + ' – RugsCreation stock – ' + new Date().toLocaleDateString('en-GB');
  var body = 'Hi ' + buyer + ',\n\n' + (orderNo? 'Thanks for order '+orderNo+'. ' : 'Thanks for your order. ') + 'Here’s where things stand on our Netherlands stock:\n\n';
  if(ok.length){
    body += 'CONFIRMED:\n';
    ok.forEach(function(l){ body += '  • ' + l.sku + ' – ' + l.name + (l.size?' ('+l.size+')':'') + ' × ' + l.qtyFulfilled + '\n'; });
    body += '\n';
  }
  if(bad.length){
    body += 'COULD NOT FULFIL (insufficient stock):\n';
    bad.forEach(function(l){
      body += '  • ' + l.sku + ' – ' + l.name + (l.size?' ('+l.size+')':'') + ' – requested ' + l.qtyRequested + ', ' + (l.availableAtOrder>0? (l.availableAtOrder+' available') : 'none in stock') + '\n';
    });
    body += '\nLet us know if you’d like to adjust quantities on the items above, or if you’d like us to hold the rest for the next shipment from India.\n\n';
  }
  body += 'Best,\n' + (STATE.meta.companyName||'RugsCreation');
  return {subject:subject, body:body};
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      UI.banner={kind:'good', text:'Copied to clipboard.'};
      rerender();
    }).catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  try{
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    UI.banner={kind:'good', text:'Copied to clipboard.'};
  }catch(e){
    UI.banner={kind:'warn', text:'Couldn’t copy automatically — select the text and copy manually.'};
  }
  rerender();
}

/* ---------- stock adjustment ---------- */
function startAdjust(sku){
  var it = invBySku(sku);
  if(!it) return;
  UI.adjust = {sku:sku, value:String(it.stock), note:''};
}
function cancelAdjust(){ UI.adjust=null; }
function saveAdjust(){
  if(!UI.adjust) return;
  var it = invBySku(UI.adjust.sku);
  if(!it) return;
  var newVal = Math.max(0, Math.floor(Number(UI.adjust.value)||0));
  if(newVal===it.stock){ UI.adjust=null; rerender(); return; }
  var rec = {id:uid('a'), type:'adjustment', ts:nowISO(), sku:it.sku, name:it.name, before:it.stock, after:newVal, note:UI.adjust.note||''};
  it.stock = newVal;
  STATE.orders.unshift(rec);
  UI.adjust=null;
  persist();
  rerender();
}

/* ---------- billing / invoicing ---------- */
function pendingOrdersFor(buyer){
  return STATE.orders.filter(function(o){ return o.type==='order' && o.buyer===buyer && !o.invoiced; });
}
function channelBalance(buyer){
  return pendingOrdersFor(buyer).reduce(function(s,o){ return s + (o.amount||0); }, 0);
}
function lastInvoiceFor(buyer){
  var list = STATE.invoices.filter(function(iv){ return iv.buyer===buyer; });
  if(!list.length) return null;
  return list.reduce(function(a,b){ return new Date(a.ts) > new Date(b.ts) ? a : b; });
}
function startInvoice(buyer){ UI.invoiceDraft = {buyer:buyer, invoiceNo:''}; }
function cancelInvoice(){ UI.invoiceDraft=null; }
function confirmInvoice(){
  if(!UI.invoiceDraft) return;
  var buyer = UI.invoiceDraft.buyer;
  var pending = pendingOrdersFor(buyer);
  if(pending.length===0){
    UI.banner={kind:'warn', text:'Nothing to invoice for '+buyer+' — no pending orders.'};
    UI.invoiceDraft=null;
    rerender();
    return;
  }
  var amount = pending.reduce(function(s,o){return s+(o.amount||0);},0);
  var ts = nowISO();
  var invNo = (UI.invoiceDraft.invoiceNo||'').trim();
  pending.forEach(function(o){ o.invoiced=true; o.invoiceNo = invNo||null; o.invoicedAt = ts; });
  STATE.invoices.unshift({id:uid('inv'), buyer:buyer, invoiceNo:invNo||null, ts:ts, amount:amount, orderCount:pending.length});
  UI.invoiceDraft=null;
  UI.banner={kind:'good', text:'Marked '+pending.length+' order'+(pending.length===1?'':'s')+' for '+buyer+' as invoiced ('+fmtEUR(amount)+'). New billing cycle started.'};
  persist();
  rerender();
}

    'sku-asc': function(a,b){return a.sku.localeCompare(b.sku);}

  list.sort(sortMap[UI.invSort] || sortMap['stock-asc']);
  return list;
}

      '<td class="mono">'+esc(it.size)+'</td>' +
      '<td class="faint">'+esc(it.fibre)+'</td>' +
      '<td class="num">'+ (UI.adjust && UI.adjust.sku===it.sku ? renderAdjustInline() : fmtInt(it.stock)) +'</td>' +
      '<td class="num">'+fmtEUR(it.price)+'</td>' +
      '<td>'+ (UI.adjust && UI.adjust.sku===it.sku ? '' : '<button class="btn btn-quiet btn-sm" data-action="start-adjust" data-sku="'+esc(it.sku)+'" type="button">Adjust</button>') +'</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderAdjustInline(){
  var a = UI.adjust;
  return '<span style="display:inline-flex; gap:6px; align-items:center;">' +
    '<input class="qtybox mono" type="number" min="0" data-bind="adjustValue" value="'+esc(a.value)+'">' +
    '<button class="btn btn-sm btn-accent" data-action="save-adjust" type="button">Save</button>' +
    '<button class="btn btn-sm btn-quiet" data-action="cancel-adjust" type="button">✕</button>' +
  '</span>';
}

function orderSuggestions(){
  var q = UI.itemQuery.trim().toLowerCase();
  if(!q) return [];
  return STATE.inventory.filter(function(it){
    return (it.sku||'').toLowerCase().indexOf(q)>=0 ||
           (it.ean||'').toLowerCase().indexOf(q)>=0 ||
           (it.name||'').toLowerCase().indexOf(q)>=0;
  }).slice(0,8);
}

function renderOrderTab(){
  var html = '<div class="panel-head"><h2>New order</h2><span class="hint">Check an incoming order (email or PDF) against stock, then approve to deduct it.</span></div>';
  html += '<div class="order-grid">';

  /* left: picker */
  html += '<div class="card">';
  html += '<div class="field"><label for="buyer-select">Channel / buyer</label><select id="buyer-select" data-bind="buyerIdx">';
  STATE.buyers.forEach(function(b,i){ html += '<option value="'+i+'"'+(UI.draft.buyerIdx==i?' selected':'')+'>'+esc(b)+'</option>'; });
  html += '</select></div>';
  html += '<div style="display:flex; gap:12px;">' +
    '<div class="field" style="flex:1;"><label for="draft-orderno">Order no. (optional)</label><input id="draft-orderno" type="text" placeholder="e.g. ORDER169243" data-bind="draftOrderNo" value="'+esc(UI.draft.orderNo)+'"></div>' +
    '<div class="field" style="flex:1;"><label for="draft-orderdate">Order date</label><input id="draft-orderdate" type="date" data-bind="draftOrderDate" value="'+esc(UI.draft.orderDate)+'"></div>' +
  '</div>';
  html += '<div class="field"><label for="item-query">Add item (article no., EAN or name)</label>' +
    '<input id="item-query" type="text" placeholder="e.g. VLR2090074 or Shelly Zickzack" data-bind="itemQuery" value="'+esc(UI.itemQuery)+'" autocomplete="off">';
  var sugg = orderSuggestions();
  if(sugg.length){
    html += '<div class="suggest">';
    sugg.forEach(function(it){
      html += '<button type="button" data-action="add-item" data-sku="'+esc(it.sku)+'">' +
        '<div class="sname">'+esc(it.name)+' <span class="faint mono">'+esc(it.size)+'</span></div>' +
        '<div class="smeta mono">'+esc(it.sku)+' · '+ (it.stock<=0? 'out of stock' : it.stock+' in stock') +'</div>' +
      '</button>';
    });
    html += '</div>';
  } else if(UI.itemQuery.trim()){
    html += '<div class="faint" style="padding-top:6px;">No matching items.</div>';
  }
  html += '</div>';
  html += '<div class="faint">Tip: search by part of the article number, EAN, or product name — exactly what’s usually in the order email.</div>';
  html += '</div>';

  /* right: ticket */
  html += '<div class="ticket">';
  var ticketSub = esc(draftBuyerName()) + (UI.draft.orderNo? ' · '+esc(UI.draft.orderNo) : '') + ' · ' + esc(UI.draft.orderDate||todayInputValue());
  html += '<h3>Order ticket</h3><div class="ticket-sub">'+ticketSub+'</div>';
  var ticketValue = UI.draft.lines.reduce(function(s,dl){ var it=invBySku(dl.sku); return s + (it? dl.qty*(it.price||0) : 0); }, 0);
  if(UI.draft.lines.length===0){
    html += '<div class="ticket-empty">No items added yet.</div>';
  } else {
    UI.draft.lines.forEach(function(dl){
      var it = invBySku(dl.sku);
      if(!it) return;
      var status = it.stock<=0 ? '<span class="pill pill-danger">Out of stock</span>' : (dl.qty<=it.stock ? '<span class="pill pill-good">In stock</span>' : '<span class="pill pill-warn">Only '+it.stock+' available</span>');
      html += '<div class="lineitem">' +
        '<div><div class="li-name">'+esc(it.name)+'</div><div class="li-meta">'+esc(it.sku)+' · '+esc(it.size)+'</div><div style="margin-top:4px;">'+status+'</div></div>' +
        '<div class="li-right">' +
          '<input class="qtybox mono" type="number" min="1" data-bind="draftQty" data-sku="'+esc(it.sku)+'" value="'+dl.qty+'">' +
          '<button class="iconbtn" data-action="remove-item" data-sku="'+esc(it.sku)+'" type="button" title="Remove" aria-label="Remove">✕</button>' +
        '</div>' +
      '</div>';
    });
  }
  if(UI.draft.lines.length>0){
    html += '<div class="faint" style="text-align:right; margin-top:8px;">Requested value: '+fmtEUR(ticketValue)+'</div>';
  }
  html += '<div class="ticket-actions">' +
    '<button class="btn btn-accent" data-action="approve-order" type="button" '+(UI.draft.lines.length===0?'disabled':'')+'>Approve &amp; deduct stock</button>' +
  '</div>';
  html += '</div>';
  html += '</div>'; /* order-grid */

  if(UI.lastOrder){
    html += renderConfirmedOrder(UI.lastOrder);
  }
  return html;
}

function renderConfirmedOrder(order){
  var pillClass = order.status==='fulfilled' ? 'pill-good' : (order.status==='partial' ? 'pill-warn' : 'pill-danger');
  var pillText = order.status==='fulfilled' ? 'Fully approved' : (order.status==='partial' ? 'Partially approved' : 'Not fulfilled');
  var html = '<div class="card" style="margin-top:20px;">';
  html += '<div class="panel-head"><h2 style="font-size:1.15rem;">Last processed order — '+esc(order.buyer)+(order.orderNo?' · '+esc(order.orderNo):'')+'</h2><span class="pill '+pillClass+'">'+pillText+'</span></div>';
  html += '<div class="faint" style="margin-bottom:10px;">Order value: <strong class="mono">'+fmtEUR(order.amount)+'</strong> · <span class="pill pill-quiet">Not yet invoiced</span></div>';
  html += '<div class="emailbox">';
  html += '<div class="field"><label>Reply email — copy into your mail client</label>' +
    '<textarea readonly id="lastorder-email">Subject: '+esc(order.email.subject)+'\n\n'+esc(order.email.body)+'</textarea></div>';
  html += '<button class="btn" data-action="copy-email" type="button">Copy email text</button>';
  html += '</div></div>';
  return html;
}

function renderHistoryTab(){
  var html = '<div class="panel-head"><h2>History</h2><span class="hint">'+fmtInt(STATE.orders.length)+' entries logged</span></div>';
  html += '<div class="toolbar">' +
    '<select data-bind="histFilter">' +
      '<option value="all"'+(UI.histFilter==='all'?' selected':'')+'>All buyers &amp; adjustments</option>';
  STATE.buyers.forEach(function(b){ html += '<option value="'+esc(b)+'"'+(UI.histFilter===b?' selected':'')+'>'+esc(b)+'</option>'; });
  html += '<option value="adjustment"'+(UI.histFilter==='adjustment'?' selected':'')+'>Stock adjustments only</option>' +
    '</select>' +
    '<button class="btn" data-action="export-history" type="button">Export CSV</button>' +
  '</div>';

  var entries = STATE.orders.filter(function(o){
    if(UI.histFilter==='all') return true;
    if(UI.histFilter==='adjustment') return o.type==='adjustment';
    return o.type==='order' && o.buyer===UI.histFilter;
  });

  if(entries.length===0){
    html += '<div class="card"><div class="faint" style="text-align:center; padding:20px;">Nothing here yet — process an order or adjust stock to see it logged.</div></div>';
    return html;
  }

  entries.forEach(function(o){
    if(o.type==='adjustment'){
      html += '<div class="histcard"><summary style="cursor:default;"><div class="hleft">' +
        '<span class="pill pill-quiet">Adjustment</span>' +
        '<span class="hbuyer" style="font-size:.95rem;">'+esc(o.name)+'</span>' +
        '<span class="faint mono">'+esc(o.sku)+'</span>' +
      '</div><div class="htime">'+fmtWhen(o.ts)+'</div></summary>' +
      '<div class="hbody" style="padding-top:10px;">Stock changed from <strong class="mono">'+fmtInt(o.before)+'</strong> to <strong class="mono">'+fmtInt(o.after)+'</strong>'+(o.note?' — '+esc(o.note):'')+'</div></div>';
      return;
    }
    var pillClass = o.status==='fulfilled' ? 'pill-good' : (o.status==='partial' ? 'pill-warn' : 'pill-danger');
    var pillText = o.status==='fulfilled' ? 'Fully approved' : (o.status==='partial' ? 'Partially approved' : 'Not fulfilled');
    var invPill = o.invoiced ? '<span class="pill pill-good">Invoiced'+(o.invoiceNo?' · '+esc(o.invoiceNo):'')+'</span>' : '<span class="pill pill-quiet">Pending invoice</span>';
    html += '<details class="histcard"><summary><div class="hleft">' +
      '<span class="hbuyer">'+esc(o.buyer)+'</span>' +
      (o.orderNo? '<span class="faint mono">'+esc(o.orderNo)+'</span>' : '') +
      '<span class="pill '+pillClass+'">'+pillText+'</span>' +
      invPill +
      '<span class="faint">'+o.lines.length+' item'+(o.lines.length===1?'':'s')+' · '+fmtEUR(o.amount)+'</span>' +
    '</div><div class="htime">'+fmtWhen(o.ts)+(o.orderDate? ' · ordered '+esc(o.orderDate) : '')+'</div></summary>';
    html += '<div class="hbody"><table><thead><tr><th>Article No.</th><th>Name</th><th>Size</th><th class="num">Requested</th><th class="num">Fulfilled</th><th>Status</th></tr></thead><tbody>';
    o.lines.forEach(function(l){
      var lp = l.status==='fulfilled' ? 'pill-good' : (l.status==='short' ? 'pill-warn' : 'pill-danger');
      var lt = l.status==='fulfilled' ? 'Fulfilled' : (l.status==='short' ? 'Insufficient stock' : 'Unavailable');
      html += '<tr><td class="mono">'+esc(l.sku)+'</td><td>'+esc(l.name)+'</td><td class="mono">'+esc(l.size)+'</td><td class="num">'+fmtInt(l.qtyRequested)+'</td><td class="num">'+fmtInt(l.qtyFulfilled)+'</td><td><span class="pill '+lp+'">'+lt+'</span></td></tr>';
    });
    html += '</tbody></table>';
    html += '<div class="emailbox"><div class="field"><label>Reply email</label><textarea readonly data-order-id="'+o.id+'">Subject: '+esc(o.email.subject)+'\n\n'+esc(o.email.body)+'</textarea></div>' +
      '<button class="btn btn-sm" data-action="copy-hist-email" data-order-id="'+o.id+'" type="button">Copy email text</button></div>';
    html += '</div></details>';
  });
  return html;
}

    '<button class="btn" data-action="save-threshold" type="button">Save threshold</button>' +

function renderBillingTab(){
  var totalOutstanding = STATE.buyers.reduce(function(s,b){return s+channelBalance(b);},0);
  var owingCount = STATE.buyers.filter(function(b){return channelBalance(b)>0;}).length;
  var html = '<div class="panel-head"><h2>Billing</h2><span class="hint">What each channel owes since their last invoice.</span></div>';
  html += '<div class="statstrip" style="grid-template-columns:repeat(3,1fr); margin-bottom:20px;">' +
    '<div class="stat"><div class="n">'+fmtEUR(totalOutstanding)+'</div><div class="lbl">Total outstanding</div></div>' +
    '<div class="stat"><div class="n '+(owingCount>0?'alert':'')+'">'+fmtInt(owingCount)+'</div><div class="lbl">Channels with a balance</div></div>' +
    '<div class="stat"><div class="n">'+fmtInt(STATE.invoices.length)+'</div><div class="lbl">Invoices raised</div></div>' +
  '</div>';

    var pend = pendingOrdersFor(b);

      html += '<tr class="'+(bal>0?'low':'')+'"><td>'+esc(b)+'</td><td class="num">'+fmtInt(pend.length)+'</td><td class="num">'+fmtEUR(bal)+'</td><td colspan="2">' +
        '<span style="display:inline-flex; gap:6px; align-items:center; flex-wrap:wrap;">' +
        '<input type="text" placeholder="Invoice no. (optional)" data-bind="invoiceNo" value="'+esc(UI.invoiceDraft.invoiceNo)+'" style="width:170px;">' +
        '<button class="btn btn-sm btn-accent" data-action="confirm-invoice" type="button">Confirm — starts new cycle</button>' +
        '<button class="btn btn-sm btn-quiet" data-action="cancel-invoice" type="button">Cancel</button>' +
        '</span></td></tr>';
    } else {
      html += '<tr class="'+(bal>0?'low':'')+'"><td>'+esc(b)+'</td><td class="num">'+fmtInt(pend.length)+'</td><td class="num">'+fmtEUR(bal)+'</td>' +
        '<td class="faint">'+(last? (fmtWhen(last.ts) + (last.invoiceNo? ' · '+esc(last.invoiceNo):'')) : 'None yet')+'</td>' +
        '<td><button class="btn btn-quiet btn-sm" data-action="start-invoice" data-buyer="'+esc(b)+'" type="button" '+(pend.length===0?'disabled':'')+'>Mark invoice created</button></td></tr>';
    }

  html += '</tbody></table></div>';

  if(STATE.invoices.length){
    html += '<div class="panel-head" style="margin-top:24px;"><h2 style="font-size:1.1rem;">Invoice history</h2><button class="btn btn-sm" data-action="export-invoices" type="button">Export CSV</button></div>';
    html += '<div class="tablewrap"><table><thead><tr><th>Channel</th><th>Date</th><th>Invoice No.</th><th class="num">Orders</th><th class="num">Amount</th></tr></thead><tbody>';
    STATE.invoices.forEach(function(iv){
      html += '<tr><td>'+esc(iv.buyer)+'</td><td class="mono">'+fmtWhen(iv.ts)+'</td><td class="mono">'+esc(iv.invoiceNo||'—')+'</td><td class="num">'+fmtInt(iv.orderCount)+'</td><td class="num">'+fmtEUR(iv.amount)+'</td></tr>';
    });

function renderSettings(){
  var html = '<div class="settingswrap" data-action="settings-overlay">' +
    '<div class="settingsbox" onclick="event.stopPropagation()">' +
    '<div class="settings-close"><button class="btn btn-quiet btn-sm" data-action="close-settings" type="button">Close ✕</button></div>' +
    '<h2>Settings</h2>' +
    '<div class="field"><label for="company-name">Business name</label><input id="company-name" type="text" data-bind="companyName" value="'+esc(STATE.meta.companyName)+'"></div>';
  STATE.buyers.forEach(function(b,i){
    html += '<div class="field"><label for="buyer-'+i+'">Buyer '+(i+1)+' name</label><input id="buyer-'+i+'" type="text" data-bind="buyerName" data-idx="'+i+'" value="'+esc(b)+'"></div>';
  });
  html += '<div class="field"><label for="settings-threshold">Low stock threshold</label><input id="settings-threshold" class="mono" type="number" min="0" data-bind="threshold" value="'+esc(threshold())+'"></div>';
  html += '<button class="btn btn-accent" data-action="save-settings" type="button" style="width:100%;">Save settings</button>';
  html += '</div></div>';

/* ---------- focus-preserving rerender ---------- */
function rerender(){
  var active = document.activeElement;
  var savedId = null, selStart=null, selEnd=null;
  if(active && active.id && document.getElementById('app').contains(active)){
    savedId = active.id;
    if('selectionStart' in active){ try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){} }
  }
  var savedSku = null;
  if(active && active.dataset && active.dataset.sku && document.getElementById('app').contains(active)){
    savedSku = active.dataset.sku;
  }
  render();
  if(savedId){
    var el = document.getElementById(savedId);
    if(el){
      el.focus();
      if(selStart!=null && 'setSelectionRange' in el){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  } else if(savedSku){
    var el2 = document.querySelector('[data-sku="'+CSS.escape(savedSku)+'"] input, input[data-sku="'+CSS.escape(savedSku)+'"]');
    if(el2) el2.focus();
  }
}

/* ---------- events ---------- */
var app = document.getElementById('app');

app.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  var action = btn.dataset.action;
  if(action==='set-tab'){ UI.tab = btn.dataset.tab; UI.lastOrder=null; rerender(); }
  else if(action==='open-settings'){ UI.settingsOpen=true; rerender(); }
  else if(action==='close-settings' || action==='settings-overlay'){ if(e.target===btn){ UI.settingsOpen=false; rerender(); } }
  else if(action==='dismiss-banner'){ UI.banner=null; rerender(); }
  else if(action==='add-item'){ addDraftLine(btn.dataset.sku); rerender(); }
  else if(action==='remove-item'){ removeDraftLine(btn.dataset.sku); rerender(); }
  else if(action==='approve-order'){ processOrder(); }
  else if(action==='copy-email'){ var ta=document.getElementById('lastorder-email'); if(ta) copyText(ta.value); }
  else if(action==='copy-hist-email'){ var ta2=document.querySelector('textarea[data-order-id="'+btn.dataset.orderId+'"]'); if(ta2) copyText(ta2.value); }
  else if(action==='export-inventory'){ exportInventory(); }
  else if(action==='export-history'){ exportHistory(); }
  else if(action==='start-adjust'){ startAdjust(btn.dataset.sku); rerender(); }
  else if(action==='cancel-adjust'){ cancelAdjust(); rerender(); }
  else if(action==='save-adjust'){ saveAdjust(); }
  else if(action==='save-settings'){ saveSettings(); }
  else if(action==='save-threshold'){ persist(); rerender(); }
  else if(action==='goto-order'){ UI.tab='order'; var it=invBySku(btn.dataset.sku); if(it){ UI.itemQuery=''; addDraftLine(it.sku); } rerender(); }
  else if(action==='start-invoice'){ startInvoice(btn.dataset.buyer); rerender(); }
  else if(action==='cancel-invoice'){ cancelInvoice(); rerender(); }
  else if(action==='confirm-invoice'){ confirmInvoice(); }
  else if(action==='export-invoices'){ exportInvoices(); }
  else if(action==='logout'){ UI.authed=false; writeStoredAuth(false); UI.settingsOpen=false; rerender(); }
});

app.addEventListener('input', function(e){
  var t = e.target;
  var bind = t.dataset.bind;
  if(!bind) return;
  if(bind==='invQuery'){ UI.invQuery = t.value; rerender(); }
  else if(bind==='itemQuery'){ UI.itemQuery = t.value; rerender(); }
  else if(bind==='draftQty'){ setDraftQty(t.dataset.sku, t.value); rerender(); }
  else if(bind==='adjustValue'){ if(UI.adjust) UI.adjust.value = t.value; }
  else if(bind==='threshold'){ STATE.meta.threshold = Math.max(0, Math.floor(Number(t.value)||0)); }
  else if(bind==='companyName'){ STATE.meta.companyName = t.value; }
  else if(bind==='buyerName'){ STATE.buyers[Number(t.dataset.idx)] = t.value; }
  else if(bind==='draftOrderNo'){ UI.draft.orderNo = t.value; rerender(); }
  else if(bind==='draftOrderDate'){ UI.draft.orderDate = t.value; rerender(); }
  else if(bind==='invoiceNo'){ if(UI.invoiceDraft) UI.invoiceDraft.invoiceNo = t.value; }
  else if(bind==='loginPass'){ UI.loginPass = t.value; }
});

app.addEventListener('change', function(e){
  var t = e.target;
  var bind = t.dataset.bind;
  if(!bind) return;
  if(bind==='invSort'){ UI.invSort = t.value; rerender(); }
  else if(bind==='buyerIdx'){ UI.draft.buyerIdx = Number(t.value); rerender(); }
  else if(bind==='histFilter'){ UI.histFilter = t.value; rerender(); }
});

/* ---------- boot ---------- */
render();
initFirebase();

})();
</script>
